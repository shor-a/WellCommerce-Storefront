<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Black circle background -->
  <circle cx="50" cy="50" r="50" fill="#111111"/>

  <!-- Hook at top -->
  <path d="M50 18 C50 18 50 14 54 14 C58 14 58 18 55 20"
        stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Neck down to shoulder start -->
  <line x1="50" y1="20" x2="50" y2="30"
        stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Left shoulder sweeping down -->
  <path d="M50 30 C50 30 38 34 24 46"
        stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Right shoulder sweeping down -->
  <path d="M50 30 C50 30 62 34 76 46"
        stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Bottom bar connecting both ends -->
  <path d="M24 46 C24 48 24 50 26 50 L74 50 C76 50 76 48 76 46"
        stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- WELL text -->
  <text x="50" y="72"
        font-family="Georgia, serif"
        font-size="18"
        font-weight="700"
        fill="white"
        text-anchor="middle"
        letter-spacing="3">WELL</text>
</svg>
